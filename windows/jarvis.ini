; J.A.R.V.I.S. baslatici ayarlari
;
; Bu dosya istege baglidir. Yoksa varsayilanlar kullanilir. Kur.cmd
; calistirildiginda WSL dagitimi ve proje klasoru otomatik bulunup
; %LOCALAPPDATA%\Programs\JARVIS\jarvis.ini icine yazilir — asil duzenlemeniz
; gereken dosya orasidir, bu sablon degil.

[jarvis]

; Hangi WSL dagitimi kullanilsin. Bos = WSL'in varsayilani.
; Listeyi gormek icin:  wsl -l -q
dagitim =

; Proje klasoru (WSL icindeki yol).
klasor = ~/jarvis

; Panelin portu. jarvis-panel --port ile ayni olmali.
port = 8765

; Panel hazir olunca tarayici acilsin mi? 0 = acma.
tarayici = 1

; Kendi penceresinde mi acilsin? 1 = evet (sekme yok, adres cubugu yok,
; gorev cubugunda kendi simgesi). Edge veya Chrome'un "--app" kipini
; kullaniyor; ikisi de yoksa varsayilan tarayicida sekme olarak acilir.
uygulama = 1

; Tam ekran acilsin mi? 1 = evet (kenarlik yok, F11 ile cikilir).
; 0 yaparsaniz asagidaki olcude normal bir pencere olarak acilir.
tamekran = 1

; Tam ekran degilken pencere olcusu. Panel 1920x1080 icin tasarlandi;
; daha kucugunde sutunlar sikisiyor.
genislik = 1920
yukseklik = 1080

; Acilis girisi (~10 saniye). 0 yaparsaniz panel dogrudan gelir.
; Giristeki satirlar gercek: model, arac sayisi, bilgi tabani, ses.
intro = 1

; Panel yanit vermezse kullanici oturumundaki watchdog sessizce yeniden baslatir.
; Varsayilan kapali: Windows acilisinda panel kullanici istemeden baslamaz.
; Otomatik kurtarma istiyorsaniz 1 yapin.
watchdog = 0

; Erisim jetonu. Bos birakirsaniz baslatici BIR KEZ uretip bu satira yazar;
; sonraki her acilista ayni deger kullanilir. Yani adres SABITTIR, yer imine
; eklenebilir, ve tarayicida acik duran eski sekme calismaya devam eder.
; Panele --jeton ile veriliyor, o yuzden .env icinde JARVIS_PANEL_TOKEN olsa
; bile adres her zaman calisir.
; Degistirmek isterseniz bu satiri bosaltin: bir sonraki aciliste yenisi
; uretilir. Jetonu paylasmayin; bu adres makinede komut calistirabilir.
jeton =

; Gelismis: panelin baslatilma bicimini tamamen degistirmek isterseniz.
; Doluysa yukaridaki 'klasor' yok sayilir.
; ONEMLI: icinde CIFT TIRNAK kullanmayin — butun betik Windows komut
; satirinda cift tirnak icinde gidiyor, fazladan bir tane ayrismayi bozar.
; komut = cd ~/jarvis && . .venv/bin/activate && exec jarvis-panel --kamera
